[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()-in-default-args idiom — not a real violation, permanent exclusion
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["app"]
testpaths = ["tests"]
