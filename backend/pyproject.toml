[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()-in-default-args idiom — not a real violation, permanent exclusion
    "E501",  # 19 pre-existing violations — tracked in #31, re-enable once fixed
    "B904",  # 8 pre-existing violations (missing `raise ... from`) — tracked in #31, re-enable once fixed
    "F841",  # 1 pre-existing violation — tracked in #31, re-enable once fixed
]
